<svg xmlns="http://www.w3.org/2000/svg" width="620" height="224" viewBox="0 0 620 224" role="img" aria-label="STICKKEN: browser fighting game with rollback netcode">
  <style>
    .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }</style>
  <rect width="620" height="224" rx="16" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="619" height="223" rx="16" fill="none" stroke="#232B36"/>
  <rect x="0" y="28" width="4" height="56" rx="2" fill="#FF5A36"/>
  <text x="36" y="48" class="mono" font-size="12.5" fill="#FF5A36" letter-spacing="1.2">MULTIPLAYER GAME · PLAY IT LIVE</text>
  <text x="35" y="88" class="sans" font-size="32" font-weight="800" fill="#F0F3F6" letter-spacing="-0.5">STICKKEN</text>
  <text x="36" y="122" class="sans" font-size="15.5" fill="#9DA7B3">Browser fighting game with GGPO-style rollback</text>
  <text x="36" y="144" class="sans" font-size="15.5" fill="#9DA7B3">netcode over P2P WebRTC on a $0 backend.</text>
  <rect x="36" y="168" width="119" height="28" rx="14" fill="#FF5A36" fill-opacity="0.10" stroke="#FF5A36" stroke-opacity="0.35"/><text x="95.5" y="187" text-anchor="middle" class="mono" font-size="13" fill="#FF5A36">Godot → WASM</text>
  <rect x="165" y="168" width="71" height="28" rx="14" fill="#FF5A36" fill-opacity="0.10" stroke="#FF5A36" stroke-opacity="0.35"/><text x="200.5" y="187" text-anchor="middle" class="mono" font-size="13" fill="#FF5A36">WebRTC</text>
  <rect x="246" y="168" width="143" height="28" rx="14" fill="#FF5A36" fill-opacity="0.10" stroke="#FF5A36" stroke-opacity="0.35"/><text x="317.5" y="187" text-anchor="middle" class="mono" font-size="13" fill="#FF5A36">Durable Objects</text>
  
  <style>
    .f-guard { animation: f-g 2.4s infinite; }
    .f-punch { opacity: 0; animation: f-p 2.4s infinite; }
    .f-def { animation: f-r 2.4s infinite; }
    .f-spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: f-s 2.4s infinite; }
    .f-dmg { opacity: 0; animation: f-d 2.4s infinite; }
    @keyframes f-g { 0%, 41.9% { opacity: 1; } 42%, 55.9% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes f-p { 0%, 41.9% { opacity: 0; } 42%, 55.9% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes f-r { 0%, 43% { transform: translateX(0); } 48% { transform: translateX(9px); } 72%, 100% { transform: translateX(0); } }
    @keyframes f-s { 0%, 43% { opacity: 0; transform: scale(0.4); } 45% { opacity: 1; transform: scale(1); } 54%, 100% { opacity: 0; transform: scale(1.3); } }
    @keyframes f-d { 0%, 44% { opacity: 0; transform: translateY(0); } 48% { opacity: 1; } 70% { opacity: 1; transform: translateY(-14px); } 76%, 100% { opacity: 0; transform: translateY(-16px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .f-guard { opacity: 1; } .f-punch, .f-spark, .f-dmg { opacity: 0; } }
  </style>
  <g transform="translate(478 148) scale(0.8)">
    <line x1="-40" y1="1" x2="124" y2="1" stroke="#232B36" stroke-width="2.5"/>
    <g>
      <circle cx="0" cy="-80" r="10" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M0 -70 L0 -30 M0 -30 L-14 0 M0 -30 L15 0 M0 -62 L-13 -45" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <path class="f-guard" d="M0 -62 L16 -52 L13 -67" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path class="f-punch" d="M0 -62 L50 -63" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g transform="translate(76 0) scale(-1 1)"><g class="f-def">
      <circle cx="0" cy="-80" r="10" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M0 -70 L0 -30 M0 -30 L-14 0 M0 -30 L15 0 M0 -62 L-13 -45" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <path d="M0 -62 L16 -52 L13 -67" stroke="#E6EDF3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g></g>
    <g class="f-spark" stroke="#FF5A36" stroke-width="2.9999999999999996" stroke-linecap="round">
      <path d="M56 -63 L66 -63 M55 -69 L62 -76 M55 -57 L62 -50 M54 -63 L50 -63"/>
    </g>
    <text class="f-dmg mono" x="80" y="-96" font-size="15" fill="#FF5A36" font-weight="700">-12</text>
  </g>
</svg>
