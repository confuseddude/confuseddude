<svg xmlns="http://www.w3.org/2000/svg" width="620" height="224" viewBox="0 0 620 224" role="img" aria-label="mcpseal: MCP tool-integrity CLI">
  <style>
    .sans { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", Menlo, Consolas, monospace; }</style>
  <rect width="620" height="224" rx="16" fill="#0B0E14"/>
  <rect x="0.5" y="0.5" width="619" height="223" rx="16" fill="none" stroke="#232B36"/>
  <rect x="0" y="28" width="4" height="56" rx="2" fill="#3DDC97"/>
  <text x="36" y="48" class="mono" font-size="12.5" fill="#3DDC97" letter-spacing="1.2">SECURITY CLI · ON NPM + PYPI</text>
  <text x="35" y="88" class="sans" font-size="32" font-weight="800" fill="#F0F3F6" letter-spacing="-0.5">mcpseal</text>
  <text x="36" y="122" class="sans" font-size="15.5" fill="#9DA7B3">Pins a hash of every MCP tool an agent can call</text>
  <text x="36" y="144" class="sans" font-size="15.5" fill="#9DA7B3">and blocks the instant one drifts.</text>
  <rect x="36" y="168" width="103" height="28" rx="14" fill="#3DDC97" fill-opacity="0.10" stroke="#3DDC97" stroke-opacity="0.35"/><text x="87.5" y="187" text-anchor="middle" class="mono" font-size="13" fill="#3DDC97">TypeScript</text>
  <rect x="149" y="168" width="71" height="28" rx="14" fill="#3DDC97" fill-opacity="0.10" stroke="#3DDC97" stroke-opacity="0.35"/><text x="184.5" y="187" text-anchor="middle" class="mono" font-size="13" fill="#3DDC97">Python</text>
  <rect x="230" y="168" width="143" height="28" rx="14" fill="#3DDC97" fill-opacity="0.10" stroke="#3DDC97" stroke-opacity="0.35"/><text x="301.5" y="187" text-anchor="middle" class="mono" font-size="13" fill="#3DDC97">SLSA provenance</text>
  
  <style>
    .s-scan { animation: s-sc 3.2s ease-in-out infinite; }
    .s-check { stroke-dasharray: 40; stroke-dashoffset: 40; animation: s-ck 3.2s ease-out infinite; }
    @keyframes s-sc { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 1; } 50% { transform: translateY(70px); opacity: 1; } 56%, 100% { transform: translateY(70px); opacity: 0; } }
    @keyframes s-ck { 0%, 52% { stroke-dashoffset: 40; } 64%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .s-check { stroke-dashoffset: 0; } .s-scan { opacity: 0; } }
  </style>
  <defs><clipPath id="s-sh"><path d="M0 0 L32 -10 L64 0 L64 30 C64 54 46 68 32 76 C18 68 0 54 0 30 Z"/></clipPath></defs>
  <g transform="translate(506 74) scale(1.05)">
    <path d="M0 0 L32 -10 L64 0 L64 30 C64 54 46 68 32 76 C18 68 0 54 0 30 Z" fill="#3DDC97" fill-opacity="0.07" stroke="#3DDC97" stroke-width="2.2" stroke-linejoin="round"/>
    <g clip-path="url(#s-sh)"><rect class="s-scan" x="-4" y="-10" width="72" height="3" fill="#3DDC97" opacity="0.8"/></g>
    <path class="s-check" d="M19 31 L29 41 L46 22" fill="none" stroke="#3DDC97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
